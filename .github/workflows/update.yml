name: Update stock data
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_data.py"
      - "scripts/build_weekly_technical.py"
      - ".github/workflows/update.yml"
  schedule:
    # 10:00 UTC = 18:00 Taiwan time, Monday-Friday; TWSE daily closing data is produced again around 17:30.
    - cron: "0 10 * * 1-5"
    # Refresh weekly-report candidate technical cache after Saturday report publication.
    - cron: "30 12 * * 6"
concurrency:
  group: update-stock-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update data
        run: python scripts/update_data.py
      - name: Build weekly candidate technical cache
        run: python scripts/build_weekly_technical.py
      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ranking.json data/dmi_watch_history.json data/weekly_technical.json
          git diff --cached --quiet || (git commit -m "Update stock ranking data" && git push)
